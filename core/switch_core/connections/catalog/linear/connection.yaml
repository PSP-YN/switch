slug: linear
name: Linear
category: Project management
description: Find, create and update Linear issues, projects and comments, as you.
enabled: true
adapter: oauth
auth:
  type: oauth
  # Linear replaces refresh tokens when renewing them.
  refresh: rotating
  oauth:
    # Linear's hosted MCP server supports OAuth 2.1 dynamic client registration.
    registration: dynamic
    redirect: [loopback]
    # The authorization-server metadata advertises a revocation endpoint.
    revocation_discovered: true
  identity:
    # Linear's GraphQL API accepts a read-only viewer query; the OAuth token
    # is sent as the bearer credential by the catalog identity checker.
    url: "https://api.linear.app/graphql?query=%7Bviewer%7Bid%20name%20email%7D%7D"
    account_id: data.viewer.id
    label: data.viewer.email
# Linear authorization-code access tokens live 24 hours by default.
token: { kind: pass_through, max_lifetime: 86400 }
mcp:
  servers:
    - { name: linear, url: "https://mcp.linear.app/mcp" }
access:
  # Linear's read scope is always present; write adds mutations.
  read:
    scopes: [read, openid, email]
  write:
    scopes: [read, write, openid, email]
tools: { mode: pass_through }
